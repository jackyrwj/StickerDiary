name: MilkTeaSticker
options:
  bundleIdPrefix: com.jackyrwj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9G5964XAXT
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PersonalSticker:
    type: application
    platform: iOS
    sources:
      - path: MilkTeaSticker
    resources:
      - path: MilkTeaSticker/Assets.xcassets
    entitlements:
      path: MilkTeaSticker/PersonalSticker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jackyrwj.PersonalSticker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyrwj.PersonalSticker
        PRODUCT_NAME: PersonalSticker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: 贴贴
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择你授权的照片，用来制作只属于你的表情贴纸。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: PersonalStickerMessages
        embed: true
  PersonalStickerMessages:
    type: app-extension
    platform: iOS
    sources:
      - path: PersonalStickerMessages
    entitlements:
      path: PersonalStickerMessages/PersonalStickerMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jackyrwj.PersonalSticker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyrwj.PersonalSticker.MessagesExtension
        PRODUCT_NAME: PersonalStickerMessages
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: PersonalStickerMessages/Info.plist
      properties:
        CFBundleDisplayName: 贴贴
        MSSupportedPresentationContexts:
          - MSMessagesAppPresentationContextMessages
          - MSMessagesAppPresentationContextMedia
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
schemes:
  PersonalSticker:
    build:
      targets:
        PersonalSticker: all
        PersonalStickerMessages: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
